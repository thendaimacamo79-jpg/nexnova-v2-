<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexNova</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:20px; }
  h1 { font-size:1.3rem; margin-bottom:4px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  .muted { color:#94a3b8; font-size:0.85rem; }
  input, select { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:1rem; }
  button { background:#3b82f6; color:white; border:none; padding:12px 20px; border-radius:8px; font-size:1rem; margin-top:8px; width:100%; }
  button:disabled { background:#475569; }
  button.secondary { background:#334155; }
  button.small { width:auto; display:inline-block; padding:5px 8px; font-size:0.7rem; margin:2px 3px 2px 0; }
  .card { background:#1e293b; border-radius:10px; padding:16px; margin:12px 0; }
  .status { margin-top:10px; font-size:0.85rem; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.8rem; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid #334155; vertical-align:top; }
  .risk-low { color:#4ade80; }
  .risk-medium { color:#facc15; }
  .risk-high { color:#f87171; }
  .risk-insufficient_data { color:#94a3b8; }
  .dup-group { border:1px solid #475569; border-radius:8px; padding:10px; margin:8px 0; }
  #app { max-width:520px; margin:0 auto; }
</style>
