function getSession() {
  const raw = sessionStorage.getItem("nn_session");
  return raw ? JSON.parse(raw) : null;
}
function setSession(s) { sessionStorage.setItem("nn_session", JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem("nn_session"); }

let refreshInFlight = null;

async function refreshSession() {
  const session = getSession();
  if (!session || !session.refresh_token) return null;
  if (refreshInFlight) return refreshInFlight;

  refreshInFlight = (async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": ANON_KEY },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!res.ok) { clearSession(); return null; }
      const data = await res.json();
      const newSession = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in * 1000)
      };
      setSession(newSession);
      return newSession;
    } catch (e) {
      return null;
    } finally {
      refreshInFlight = null;
    }
  })();

  return refreshInFlight;
}

async function ensureValidSession() {
  let session = getSession();
  if (!session) return null;
  const expiringSoon = !session.expires_at || session.expires_at < Date.now() + 60000;
  if (expiringSoon) session = await refreshSession();
  return session;
}

async function api(path, opts = {}) {
  let session = await ensureValidSession();
  const buildHeaders = (s) => ({
    "Content-Type": "application/json",
    "apikey": ANON_KEY,
    "Authorization": `Bearer ${s ? s.access_token : ANON_KEY}`,
    ...(opts.headers || {})
  });

  let res = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers: buildHeaders(session) });

  // Belt-and-braces: if the token was rejected despite the proactive refresh
  // (e.g. clock drift, or it was revoked), try refreshing once more before giving up.
  if (res.status === 401 && session) {
    session = await refreshSession();
    if (session) {
      res = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers: buildHeaders(session) });
    }
  }

  if (res.status === 401) {
    clearSession();
    content.innerHTML = `<div class="card">A tua sessão expirou. Entra de novo para continuares.</div>`;
    setTimeout(renderLogin, 1500);
    throw new Error("Sessão expirada");
  }

  if (!res.ok) {
    const err = await res.text();
    throw new Error(`${res.status}: ${err}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function captureTokenFromHash() {
  if (location.hash.includes("access_token")) {
    const params = new URLSearchParams(location.hash.substring(1));
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    const expires_in = parseInt(params.get("expires_in") || "3600", 10);
    if (access_token) {
      setSession({ access_token, refresh_token, expires_at: Date.now() + (expires_in * 1000) });
      history.replaceState(null, "", location.pathname);
    }
  }
}

// ============ Helpers de apresentação ============

function riskLabel(code) {
  const labels = { high: "Alto", medium: "Médio", low: "Baixo", insufficient_data: "Poucos dados" };
  return labels[code] || code;
}

function cleanName(name) {
  return String(name || "").trim().replace(/\s+/g, " ");
}

// ============ IMPORT: normalization helpers (ported from validated Python logic) ============

function normalizeName(name) {
  if (!name) return "";
  let s = String(name).trim().replace(/\s+/g, " ");
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return s.toLowerCase();
}

function normalizePhone(phone) {
  if (!phone) return "";
  return String(phone).replace(/\D/g, "");
}

function parseDateCell(val) {
  if (val instanceof Date && !isNaN(val)) {
    const y = val.getFullYear(), m = val.getMonth() + 1, d = val.getDate();
    return { date: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }
  if (val === null || val === undefined || String(val).trim() === "") {
    return { date: null, error: "vazio" };
  }
  const s = String(val).trim();

  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const d = parseInt(m[1]), mo = parseInt(m[2]), y = parseInt(m[3]);
    if (mo > 12) return { date: null, error: `mês inválido (${mo}) em '${s}'` };
    if (d > 31 || d < 1) return { date: null, error: `data inválida '${s}'` };
    return { date: `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }

  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (m) {
    const y = parseInt(m[1]), mo = parseInt(m[2]), d = parseInt(m[3]);
    return { date: `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }

  m = s.match(/^(\d{1,2})\s+de\s+(\w+)$/i);
  if (m) return { date: null, error: `sem ano especificado '${s}'` };

  return { date: null, error: `formato de data não reconhecido '${s}'` };
}

function parseAmountCell(val) {
  if (val === null || val === undefined || String(val).trim() === "") {
    return { amount: null, error: "vazio" };
  }
  if (typeof val === "number") return { amount: val, error: null };

  const s = String(val).trim();
  if (s.includes("R$")) return { amount: null, error: `moeda inesperada (R$) em '${s}' — confirmar se é MZN/EUR` };
  if (s.includes("$") && !s.includes("R$")) return { amount: null, error: `símbolo de moeda ambíguo '${s}'` };

  let sClean = s.replace("€", "").trim();

  if (/^\d{1,3}(\.\d{3})*,\d{2}$/.test(sClean)) {
    sClean = sClean.replace(/\./g, "").replace(",", ".");
    return { amount: parseFloat(sClean), error: null };
  }
  if (/^\d+,\d+$/.test(sClean)) {
    return { amount: parseFloat(sClean.replace(",", ".")), error: null };
  }
  if (/^\d+(\.\d+)?$/.test(sClean)) {
    return { amount: parseFloat(sClean), error: null };
  }
  return { amount: null, error: `formato de valor não reconhecido '${s}'` };
}

function isJunkRow(clientRaw) {
  if (!clientRaw || String(clientRaw).trim() === "") return true;
  const upper = String(clientRaw).trim().toUpperCase();
  if (upper.includes("TOTAL") || upper.includes("SUBTOTAL") || upper.includes("SOMA")) return true;
  return false;
}

// ============ IMPORT: Step 1 - file upload ============

let importState = {};

function renderImportStep1(business) {
  importState = { business };
  content.innerHTML = `
    <div class="card">
      <h2>Importar — passo 1 de 3</h2>
      <p class="muted">Escolhe o ficheiro (.xlsx ou .csv)</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div id="status" class="status"></div>
    </div>
    <button class="secondary" id="backBtn">Voltar</button>
  `;
  document.getElementById("backBtn").onclick = () => renderDashboard(business);

  document.getElementById("fileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById("status");
    status.textContent = "A ler ficheiro...";
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });

      let headerRowIdx = 0;
      for (let i = 0; i < Math.min(10, rows.length); i++) {
        const textCells = (rows[i] || []).filter(c => c !== null && typeof c === "string" && c.trim() !== "");
        if (textCells.length >= 2) { headerRowIdx = i; break; }
      }

      importState.rows = rows;
      importState.headerRowIdx = headerRowIdx;
      renderImportStep2();
    } catch (err) {
      status.textContent = "❌ Erro a ler o ficheiro: " + err.message;
    }
  };
}

function renderImportStep2() {
  const { rows, headerRowIdx, business } = importState;
  const headerRow = rows[headerRowIdx] || [];
  const numCols = Math.max(...rows.map(r => (r || []).length));

  const colOptions = (guessRegex) => {
    let opts = `<option value="">— não usar —</option>`;
    for (let c = 0; c < numCols; c++) {
      const label = headerRow[c] ? String(headerRow[c]) : `Coluna ${c + 1}`;
      const guess = guessRegex && headerRow[c] && guessRegex.test(String(headerRow[c]));
      opts += `<option value="${c}" ${guess ? "selected" : ""}>${label}</option>`;
    }
    return opts;
  };

  content.innerHTML = `
    <div class="card">
      <h2>Importar — passo 2 de 3</h2>
      <p class="muted">Confirma qual coluna é qual (cabeçalho detetado na linha ${headerRowIdx + 1})</p>
      <label class="muted">Nome do cliente</label>
      <select id="colClient">${colOptions(/client|nome/i)}</select>
      <label class="muted">Data</label>
      <select id="colDate">${colOptions(/data|date/i)}</select>
      <label class="muted">Valor</label>
      <select id="colAmount">${colOptions(/valor|amount|pre[cç]o/i)}</select>
      <label class="muted">Telefone (opcional, ajuda a detetar duplicados)</label>
      <select id="colPhone">${colOptions(/tel|phone|contacto/i)}</select>
      <button id="processBtn">Processar</button>
      <div id="status" class="status"></div>
    </div>
    <button class="secondary" id="backBtn">Voltar</button>
  `;
  document.getElementById("backBtn").onclick = () => renderImportStep1(business);

  document.getElementById("processBtn").onclick = () => {
    const colClient = document.getElementById("colClient").value;
    const colDate = document.getElementById("colDate").value;
    const colAmount = document.getElementById("colAmount").value;
    const colPhone = document.getElementById("colPhone").value;
    const status = document.getElementById("status");
    if (colClient === "" || colDate === "" || colAmount === "") {
      status.textContent = "Escolhe pelo menos Cliente, Data e Valor.";
      return;
    }
    importState.cols = {
      client: parseInt(colClient),
      date: parseInt(colDate),
      amount: parseInt(colAmount),
      phone: colPhone !== "" ? parseInt(colPhone) : null
    };
    processRows();
    renderImportStep3();
  };
}

function processRows() {
  const { rows, headerRowIdx, cols } = importState;
  const out = [];

  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const clientRaw = row[cols.client];
    const dateRaw = row[cols.date];
    const amountRaw = row[cols.amount];
    const phoneRaw = cols.phone !== null ? row[cols.phone] : null;

    if (isJunkRow(clientRaw)) {
      if (clientRaw && String(clientRaw).trim() !== "") {
        out.push({ rowNum: r + 1, clientRaw, excluded: true });
      }
      continue;
    }

    const { date, error: dateErr } = parseDateCell(dateRaw);
    const { amount, error: amountErr } = parseAmountCell(amountRaw);
    const issues = [];
    if (dateErr) issues.push(`data: ${dateErr}`);
    if (amountErr) issues.push(`valor: ${amountErr}`);

    out.push({
      rowNum: r + 1,
      clientRaw,
      clientNormalized: normalizeName(clientRaw),
      phoneRaw,
      phoneNormalized: normalizePhone(phoneRaw),
      date, amount,
      ok: issues.length === 0,
      issues
    });
  }

  const byName = {};
  out.forEach(r => {
    if (r.excluded) return;
    (byName[r.clientNormalized] = byName[r.clientNormalized] || []).push(r);
  });
  const nameGroups = Object.entries(byName)
    .filter(([k, list]) => new Set(list.map(r => r.clientRaw)).size > 1)
    .map(([key, list]) => ({ type: "name", key, rows: list, rawVariants: [...new Set(list.map(r => r.clientRaw))] }));

  const byPhone = {};
  out.forEach(r => {
    if (r.excluded || !r.phoneNormalized) return;
    (byPhone[r.phoneNormalized] = byPhone[r.phoneNormalized] || []).push(r);
  });
  const phoneGroups = Object.entries(byPhone)
    .filter(([k, list]) => new Set(list.map(r => r.clientNormalized)).size > 1)
    .map(([key, list]) => ({ type: "phone", key, rows: list, rawVariants: [...new Set(list.map(r => r.clientRaw))] }));

  importState.processed = out;
  importState.dupGroups = [...nameGroups, ...phoneGroups];
}

function renderImportStep3() {
  const { business, processed, dupGroups } = importState;
  const okRows = processed.filter(r => !r.excluded && r.ok);
  const reviewRows = processed.filter(r => !r.excluded && !r.ok);
  const excludedRows = processed.filter(r => r.excluded);

  content.innerHTML = `
    <div class="card">
      <h2>Importar — passo 3 de 3 (revisão)</h2>
      <p class="muted">${okRows.length} linhas prontas · ${reviewRows.length} assinaladas · ${excludedRows.length} excluídas</p>
    </div>

    ${dupGroups.length > 0 ? `
    <div class="card">
      <p><strong>Possíveis duplicados</strong></p>
      ${dupGroups.map((g, i) => `
        <div class="dup-group">
          <div class="muted">${g.type === "name" ? "Mesmo nome (grafia diferente)" : "Mesmo telefone, nome diferente"}</div>
          <div>${g.rawVariants.join(" / ")}</div>
          <label style="display:flex; align-items:center; gap:8px; margin-top:6px;">
            <input type="checkbox" id="dupgroup_${i}" ${g.type === "name" ? "checked" : ""} style="width:auto;">
            <span>É a mesma pessoa</span>
          </label>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="card">
      <p><strong>Linhas prontas (${okRows.length})</strong></p>
      <table>
        <tr><th>Cliente</th><th>Data</th><th>Valor</th></tr>
        ${okRows.map(r => `<tr><td>${r.clientRaw}</td><td>${r.date}</td><td>${r.amount}</td></tr>`).join("")}
      </table>
    </div>

    ${reviewRows.length > 0 ? `
    <div class="card">
      <p><strong>Assinaladas — não importadas (${reviewRows.length})</strong></p>
      <table>
        <tr><th>Cliente</th><th>Motivo</th></tr>
        ${reviewRows.map(r => `<tr><td>${r.clientRaw}</td><td>${r.issues.join("; ")}</td></tr>`).join("")}
      </table>
    </div>` : ""}

    <div class="card">
      <button id="confirmImportBtn">Importar ${okRows.length} linhas</button>
      <div id="status" class="status"></div>
    </div>
    <button class="secondary" id="backBtn">Cancelar</button>
  `;

  document.getElementById("backBtn").onclick = () => renderDashboard(business);

  document.getElementById("confirmImportBtn").onclick = async () => {
    const status = document.getElementById("status");
    status.textContent = "A importar...";
    try {
      const nameToCanonical = {};
      dupGroups.forEach((g, i) => {
        const merge = document.getElementById(`dupgroup_${i}`).checked;
        if (merge) {
          const canonical = cleanName(g.rawVariants.sort((a, b) => cleanName(b).length - cleanName(a).length)[0]);
          g.rows.forEach(r => { nameToCanonical[r.clientNormalized] = canonical; });
        }
      });

      const finalClientNames = new Set();
      okRows.forEach(r => {
        const canonical = nameToCanonical[r.clientNormalized] || cleanName(r.clientRaw);
        finalClientNames.add(canonical);
      });

      const nameToId = {};
      for (const name of finalClientNames) {
        const created = await api("/rest/v1/clients", {
          method: "POST",
          headers: { "Prefer": "return=representation" },
          body: JSON.stringify({ business_id: business.id, name })
        });
        nameToId[name] = created[0].id;
      }

      let salesCount = 0;
      for (const r of okRows) {
        const canonical = nameToCanonical[r.clientNormalized] || cleanName(r.clientRaw);
        await api("/rest/v1/sales", {
          method: "POST",
          body: JSON.stringify({
            business_id: business.id,
            client_id: nameToId[canonical],
            amount: r.amount,
            sale_date: r.date
          })
        });
        salesCount++;
      }

      status.textContent = `✅ Importado: ${finalClientNames.size} clientes, ${salesCount} vendas.`;
      setTimeout(() => renderDashboard(business), 2000);
    } catch (e) {
      status.textContent = "❌ " + e.message;
    }
  };
}

// ============ Init ============
captureTokenFromHash();
if (getSession()) {
  renderApp();
} else {
  renderLogin();
}
</script>
