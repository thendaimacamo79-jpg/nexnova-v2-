<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexNova</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F7;
    --ink: #1D1D1F;
    --ink-soft: #6E6E73;
    --ink-faint: #AEAEB2;
    --line: #E5E5E7;
    --navy: #152238;
    --alert: #D7372E;
    --amber: #C8872A;
  }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 56px;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 0 20px; }

  .topbar { display: flex; align-items: center; gap: 9px; padding: 22px 0 6px; }
  .topbar img { width: 22px; height: 22px; display: block; border-radius: 5px; }
  .topbar .wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--ink); }

  h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; margin: 0 0 4px; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  input, select {
    width: 100%;
    padding: 13px 14px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--navy); }
  label.field-label { display: block; font-size: 12px; color: var(--ink-soft); margin: 14px 0 2px; }

  button.btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    margin-top: 10px;
    width: 100%;
    font-family: inherit;
  }
  button.btn:disabled { background: var(--ink-faint); }
  button.btn-outline { background: transparent; color: var(--navy); border: 1px solid var(--line); }

  button.btn-text-sm {
    background: none; border: none; color: var(--navy);
    font-size: 12.5px; font-weight: 500; padding: 0; margin: 0 14px 0 0;
    width: auto; font-family: inherit; cursor: pointer;
  }
  button.btn-text-sm.danger { color: var(--alert); }

  button.link-action {
    background: none; border: none; color: var(--navy);
    font-size: 14px; font-weight: 500; padding: 10px 0; margin: 0;
    width: auto; font-family: inherit; cursor: pointer;
  }
  .back-nav {
    font-size: 14px; color: var(--navy); margin-bottom: 18px;
    display: inline-block; cursor: pointer;
  }

  .section { padding: 26px 0; border-top: 1px solid var(--line); }
  .section:first-child { border-top: none; }

  .status { margin-top: 10px; font-size: 13px; }
  .status.ok { color: var(--ink); }
  .status.err { color: var(--alert); }

  .biz-name { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
  .biz-type { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; }
  .stat { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .stat:nth-child(odd) { padding-right: 14px; border-right: 1px solid var(--line); }
  .stat:nth-child(even) { padding-left: 14px; }
  .stat .stat-label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .stat .stat-value { font-size: 21px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; color: var(--navy); }
  .stat .stat-value.alert { color: var(--alert); }
  .stat .stat-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .risk-surface { background: var(--surface); border-radius: 14px; padding: 2px 16px; margin-top: 14px; }
  .risk-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #E8E8EA; font-size: 14px; }
  .risk-item:last-child { border-bottom: none; }
  .risk-item .days { color: var(--alert); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .client-row { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .client-row:first-of-type { border-top: 1px solid var(--line); }
  .client-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .client-id { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .client-id .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--ink-faint); }
  .client-id .dot.high { background: var(--alert); }
  .client-id .dot.medium { background: var(--amber); }
  .client-id .name { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .client-figures { text-align: right; flex-shrink: 0; }
  .client-figures .amt { font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .client-figures .sub { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .client-actions { margin-top: 8px; }
  .sales-panel { margin-top: 10px; padding: 10px 12px; background: var(--surface); border-radius: 10px; }
  .sale-line { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #E8E8EA; font-size: 13px; }
  .sale-line:last-child { border-bottom: none; }

  table.data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  table.data-table th { text-align: left; font-size: 11px; color: var(--ink-soft); font-weight: 500; padding: 0 6px 8px 0; border-bottom: 1px solid var(--ink); }
  table.data-table td { padding: 9px 6px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

  .dup-group { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .dup-group .muted { margin-bottom: 3px; }
  .dup-group label { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  .dup-group input[type=checkbox] { width: auto; margin: 0; }
</style>
</head>

<script>
const SUPABASE_URL = "https://hxrwhxlzcowhrttllikb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cndoeGx6Y293aHJ0dGxsaWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODYyNDgsImV4cCI6MjEwNDU2MjI0OH0.RWLHVtUT-7cz1LL-pDcv-je78JsbBvyo1xWo6j4d7Lw";

const content = document.getElementById("content");

function setStatus(el, msg, kind) {
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}

function getSession() {
  const raw = sessionStorage.getItem("nn_session");
  return raw ? JSON.parse(raw) : null;
}
function setSession(s) { sessionStorage.setItem("nn_session", JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem("nn_session"); }

let refreshInFlight = null;

async function refreshSession() {
  const session = getSession();
  if (!session || !session.refresh_token) return null;
  if (refreshInFlight) return refreshInFlight;

  refreshInFlight = (async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": ANON_KEY },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!res.ok) { clearSession(); return null; }
      const data = await res.json();
      const newSession = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in * 1000)
      };
      setSession(newSession);
      return newSession;
    } catch (e) {
      return null;
    } finally {
      refreshInFlight = null;
    }
  })();

  return refreshInFlight;
}

async function ensureValidSession() {
  let session = getSession();
  if (!session) return null;
  const expiringSoon = !session.expires_at || session.expires_at < Date.now() + 60000;
  if (expiringSoon) session = await refreshSession();
  return session;
}

async function api(path, opts = {}) {
  let session = await ensureValidSession();
  const buildHeaders = (s) => ({
    "Content-Type": "application/json",
    "apikey": ANON_KEY,
    "Authorization": `Bearer ${s ? s.access_token : ANON_KEY}`,
    ...(opts.headers || {})
  });

  let res = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers: buildHeaders(session) });

  // Belt-and-braces: if the token was rejected despite the proactive refresh
  // (e.g. clock drift, or it was revoked), try refreshing once more before giving up.
  if (res.status === 401 && session) {
    session = await refreshSession();
    if (session) {
      res = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers: buildHeaders(session) });
    }
  }

  if (res.status === 401) {
    clearSession();
    content.innerHTML = `<div class="section">A tua sessão expirou. Entra de novo para continuares.</div>`;
    setTimeout(renderLogin, 1500);
    throw new Error("Sessão expirada");
  }

  if (!res.ok) {
    const err = await res.text();
    throw new Error(`${res.status}: ${err}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function captureTokenFromHash() {
  if (location.hash.includes("access_token")) {
    const params = new URLSearchParams(location.hash.substring(1));
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    const expires_in = parseInt(params.get("expires_in") || "3600", 10);
    if (access_token) {
      setSession({ access_token, refresh_token, expires_at: Date.now() + (expires_in * 1000) });
      history.replaceState(null, "", location.pathname);
    }
  }
}

// ============ LOGIN ============

function renderLogin() {
  content.innerHTML = `
    <div class="section">
      <h2>Entrar</h2>
      <p class="muted">Usa o teu email — vais receber um link de acesso.</p>
      <input id="email" type="email" placeholder="email@exemplo.com">
      <button class="btn" id="sendBtn">Enviar link de acesso</button>
      <div id="status" class="status"></div>
    </div>
  `;
  document.getElementById("sendBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const status = document.getElementById("status");
    const btn = document.getElementById("sendBtn");
    if (!email) { setStatus(status, "Escreve um email válido.", "err"); return; }
    btn.disabled = true;
    setStatus(status, "A enviar...");
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": ANON_KEY },
        body: JSON.stringify({
          email,
          create_user: true,
          options: { email_redirect_to: location.origin + location.pathname }
        })
      });
      if (res.ok) {
        setStatus(status, "Verifica o teu email e clica no link.", "ok");
      } else {
        setStatus(status, "Erro: " + await res.text(), "err");
      }
    } catch (e) {
      setStatus(status, "Falha: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  };
}

async function renderApp() {
  content.innerHTML = `<p class="muted" style="margin-top:20px;">A carregar...</p>`;
  try {
    const memberships = await api("/rest/v1/business_members?select=business_id,role,businesses(id,name,business_type)");
    if (!memberships || memberships.length === 0) {
      renderCreateBusiness();
    } else {
      renderDashboard(memberships[0].businesses);
    }
  } catch (e) {
    // api() already shows its own message and redirects to login on a dead session.
    if (e.message !== "Sessão expirada") {
      content.innerHTML = `<div class="section">Não foi possível carregar. Verifica a ligação e tenta novamente.</div>`;
    }
  }
}

function renderCreateBusiness() {
  content.innerHTML = `
    <div class="section">
      <h2>Criar negócio</h2>
      <p class="muted">Ainda não tens nenhum negócio registado.</p>
      <input id="bizName" placeholder="Nome do negócio">
      <input id="bizType" placeholder="Tipo (ex: retalho, serviços)">
      <button class="btn" id="createBtn">Criar negócio</button>
      <div id="status" class="status"></div>
    </div>
  `;
  document.getElementById("createBtn").onclick = async () => {
    const name = document.getElementById("bizName").value.trim();
    const type = document.getElementById("bizType").value.trim();
    const status = document.getElementById("status");
    if (!name) { setStatus(status, "Dá um nome ao negócio.", "err"); return; }
    setStatus(status, "A criar...");
    try {
      await api("/rest/v1/rpc/create_business_with_owner", {
        method: "POST",
        body: JSON.stringify({ p_name: name, p_business_type: type || null })
      });
      renderApp();
    } catch (e) {
      setStatus(status, e.message, "err");
    }
  };
}

// ============ DASHBOARD ============

async function renderDashboard(business) {
  content.innerHTML = `
    <div class="section" style="padding-top:8px;">
      <div class="biz-name">${business.name}</div>
      ${business.business_type ? `<div class="biz-type">${business.business_type}</div>` : ""}
    </div>

    <div class="section">
      <h2>Resumo</h2>
      <div class="stats-grid" id="metricsCard"></div>
    </div>

    <div class="section">
      <h2>Clientes em risco de sair</h2>
      <div id="highRiskCard"></div>
    </div>

    <div class="section">
      <h2>Adicionar cliente</h2>
      <input id="clientName" placeholder="Nome do cliente">
      <button class="btn" id="addClientBtn">Adicionar cliente</button>
      <div id="clientStatus" class="status"></div>
    </div>

    <div class="section">
      <h2>Registar venda</h2>
      <select id="saleClient"><option value="">Escolhe o cliente</option></select>
      <input id="saleAmount" type="number" step="0.01" min="0.01" placeholder="Valor">
      <label class="field-label">Data da venda</label>
      <input id="saleDate" type="date">
      <button class="btn" id="addSaleBtn">Registar venda</button>
      <div id="saleStatus" class="status"></div>
    </div>

    <div class="section">
      <h2>Importar dados</h2>
      <p class="muted">A partir de uma folha de cálculo (.xlsx ou .csv)</p>
      <button class="btn btn-outline" id="importBtn">Importar ficheiro</button>
    </div>

    <div class="section">
      <h2>Clientes</h2>
      <div id="clientsTable"><p class="muted" style="margin-top:14px;">A carregar...</p></div>
    </div>

    <div class="section">
      <button class="link-action" id="logoutBtn">Sair</button>
    </div>
  `;

// ============ Helpers de apresentação ============

function riskLabel(code) {
  const labels = { high: "Alto", medium: "Médio", low: "Baixo", insufficient_data: "Poucos dados" };
  return labels[code] || code;
}

function cleanName(name) {
  return String(name || "").trim().replace(/\s+/g, " ");
}

// ============ IMPORT: normalization helpers (ported from validated Python logic) ============

function normalizeName(name) {
  if (!name) return "";
  let s = String(name).trim().replace(/\s+/g, " ");
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return s.toLowerCase();
}

function normalizePhone(phone) {
  if (!phone) return "";
  return String(phone).replace(/\D/g, "");
}

function parseDateCell(val) {
  if (val instanceof Date && !isNaN(val)) {
    const y = val.getFullYear(), m = val.getMonth() + 1, d = val.getDate();
    return { date: `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }
  if (val === null || val === undefined || String(val).trim() === "") {
    return { date: null, error: "vazio" };
  }
  const s = String(val).trim();

  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const d = parseInt(m[1]), mo = parseInt(m[2]), y = parseInt(m[3]);
    if (mo > 12) return { date: null, error: `mês inválido (${mo}) em '${s}'` };
    if (d > 31 || d < 1) return { date: null, error: `data inválida '${s}'` };
    return { date: `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }

  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (m) {
    const y = parseInt(m[1]), mo = parseInt(m[2]), d = parseInt(m[3]);
    return { date: `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`, error: null };
  }

  m = s.match(/^(\d{1,2})\s+de\s+(\w+)$/i);
  if (m) return { date: null, error: `sem ano especificado '${s}'` };

  return { date: null, error: `formato de data não reconhecido '${s}'` };
}

function parseAmountCell(val) {
  const result = parseAmountCellRaw(val);
  // The DB (and the manual sale form) reject amount <= 0, so flag it here too
  // instead of letting it fail mid-import with a raw Postgres error.
  if (result.error === null && result.amount <= 0) {
    return { amount: null, error: `valor tem de ser maior que zero (recebido '${val}')` };
  }
  return result;
}

function parseAmountCellRaw(val) {
  if (val === null || val === undefined || String(val).trim() === "") {
    return { amount: null, error: "vazio" };
  }
  if (typeof val === "number") return { amount: val, error: null };

  const s = String(val).trim();
  if (s.includes("R$")) return { amount: null, error: `moeda inesperada (R$) em '${s}' — confirmar se é MZN/EUR` };
  if (s.includes("$") && !s.includes("R$")) return { amount: null, error: `símbolo de moeda ambíguo '${s}'` };

  let sClean = s.replace("€", "").trim();

  if (/^\d{1,3}(\.\d{3})*,\d{2}$/.test(sClean)) {
    sClean = sClean.replace(/\./g, "").replace(",", ".");
    return { amount: parseFloat(sClean), error: null };
  }
  if (/^\d+,\d+$/.test(sClean)) {
    return { amount: parseFloat(sClean.replace(",", ".")), error: null };
  }
  if (/^\d+(\.\d+)?$/.test(sClean)) {
    return { amount: parseFloat(sClean), error: null };
  }
  return { amount: null, error: `formato de valor não reconhecido '${s}'` };
}

function isJunkRow(clientRaw) {
  if (!clientRaw || String(clientRaw).trim() === "") return true;
  const upper = String(clientRaw).trim().toUpperCase();
  if (upper.includes("TOTAL") || upper.includes("SUBTOTAL") || upper.includes("SOMA")) return true;
  return false;
}

// ============ IMPORT: Step 1 - file upload ============

let importState = {};

function renderImportStep1(business) {
  importState = { business };
  content.innerHTML = `
    <div class="section" style="padding-top:8px;">
      <a class="back-nav" id="backBtn">‹ Voltar</a>
      <h2>Importar — passo 1 de 3</h2>
      <p class="muted">Escolhe o ficheiro (.xlsx ou .csv)</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div id="status" class="status"></div>
    </div>
  `;
  document.getElementById("backBtn").onclick = () => renderDashboard(business);

  document.getElementById("fileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById("status");
    setStatus(status, "A ler ficheiro...");
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });

      let headerRowIdx = 0;
      for (let i = 0; i < Math.min(10, rows.length); i++) {
        const textCells = (rows[i] || []).filter(c => c !== null && typeof c === "string" && c.trim() !== "");
        if (textCells.length >= 2) { headerRowIdx = i; break; }
      }

      importState.rows = rows;
      importState.headerRowIdx = headerRowIdx;
      renderImportStep2();
    } catch (err) {
      setStatus(status, "Erro a ler o ficheiro: " + err.message, "err");
    }
  };
}

function renderImportStep2() {
  const { rows, headerRowIdx, business } = importState;
  const headerRow = rows[headerRowIdx] || [];
  const numCols = Math.max(...rows.map(r => (r || []).length));

  const colOptions = (guessRegex) => {
    let opts = `<option value="">— não usar —</option>`;
    for (let c = 0; c < numCols; c++) {
      const label = headerRow[c] ? String(headerRow[c]) : `Coluna ${c + 1}`;
      const guess = guessRegex && headerRow[c] && guessRegex.test(String(headerRow[c]));
      opts += `<option value="${c}" ${guess ? "selected" : ""}>${label}</option>`;
    }
    return opts;
  };

  content.innerHTML = `
    <div class="section" style="padding-top:8px;">
      <a class="back-nav" id="backBtn">‹ Voltar</a>
      <h2>Importar — passo 2 de 3</h2>
      <p class="muted">Confirma qual coluna é qual (cabeçalho detetado na linha ${headerRowIdx + 1})</p>
      <label class="field-label">Nome do cliente</label>
      <select id="colClient">${colOptions(/client|nome/i)}</select>
      <label class="field-label">Data</label>
      <select id="colDate">${colOptions(/data|date/i)}</select>
      <label class="field-label">Valor</label>
      <select id="colAmount">${colOptions(/valor|amount|pre[cç]o/i)}</select>
      <label class="field-label">Telefone (opcional, ajuda a detetar duplicados)</label>
      <select id="colPhone">${colOptions(/tel|phone|contacto/i)}</select>
      <button class="btn" id="processBtn">Processar</button>
      <div id="status" class="status"></div>
    </div>
  `;
  document.getElementById("backBtn").onclick = () => renderImportStep1(business);

  document.getElementById("processBtn").onclick = () => {
    const colClient = document.getElementById("colClient").value;
    const colDate = document.getElementById("colDate").value;
    const colAmount = document.getElementById("colAmount").value;
    const colPhone = document.getElementById("colPhone").value;
    const status = document.getElementById("status");
    if (colClient === "" || colDate === "" || colAmount === "") {
      setStatus(status, "Escolhe pelo menos Cliente, Data e Valor.", "err");
      return;
    }
    importState.cols = {
      client: parseInt(colClient),
      date: parseInt(colDate),
      amount: parseInt(colAmount),
      phone: colPhone !== "" ? parseInt(colPhone) : null
    };
    processRows();
    renderImportStep3();
  };
}

function processRows() {
  const { rows, headerRowIdx, cols } = importState;
  const out = [];

  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const clientRaw = row[cols.client];
    const dateRaw = row[cols.date];
    const amountRaw = row[cols.amount];
    const phoneRaw = cols.phone !== null ? row[cols.phone] : null;

    if (isJunkRow(clientRaw)) {
      if (clientRaw && String(clientRaw).trim() !== "") {
        out.push({ rowNum: r + 1, clientRaw, excluded: true });
      }
      continue;
    }

    const { date, error: dateErr } = parseDateCell(dateRaw);
    const { amount, error: amountErr } = parseAmountCell(amountRaw);
    const issues = [];
    if (dateErr) issues.push(`data: ${dateErr}`);
    if (amountErr) issues.push(`valor: ${amountErr}`);

    out.push({
      rowNum: r + 1,
      clientRaw,
      clientNormalized: normalizeName(clientRaw),
      phoneRaw,
      phoneNormalized: normalizePhone(phoneRaw),
      date, amount,
      ok: issues.length === 0,
      issues
    });
  }

  const byName = {};
  out.forEach(r => {
    if (r.excluded) return;
    (byName[r.clientNormalized] = byName[r.clientNormalized] || []).push(r);
  });
  const nameGroups = Object.entries(byName)
    .filter(([k, list]) => new Set(list.map(r => r.clientRaw)).size > 1)
    .map(([key, list]) => ({ type: "name", key, rows: list, rawVariants: [...new Set(list.map(r => r.clientRaw))] }));

  const byPhone = {};
  out.forEach(r => {
    if (r.excluded || !r.phoneNormalized) return;
    (byPhone[r.phoneNormalized] = byPhone[r.phoneNormalized] || []).push(r);
  });
  const phoneGroups = Object.entries(byPhone)
    .filter(([k, list]) => new Set(list.map(r => r.clientNormalized)).size > 1)
    .map(([key, list]) => ({ type: "phone", key, rows: list, rawVariants: [...new Set(list.map(r => r.clientRaw))] }));

  importState.processed = out;
  importState.dupGroups = [...nameGroups, ...phoneGroups];
}

function renderImportStep3() {
  const { business, processed, dupGroups } = importState;
  const okRows = processed.filter(r => !r.excluded && r.ok);
  const reviewRows = processed.filter(r => !r.excluded && !r.ok);
  const excludedRows = processed.filter(r => r.excluded);

  content.innerHTML = `
    <div class="section" style="padding-top:8px;">
      <a class="back-nav" id="backBtn">Cancelar</a>
      <h2>Importar — passo 3 de 3 (revisão)</h2>
      <p class="muted">${okRows.length} linhas prontas · ${reviewRows.length} assinaladas · ${excludedRows.length} excluídas</p>
    </div>

    ${dupGroups.length > 0 ? `
    <div class="section">
      <h2>Possíveis duplicados</h2>
      ${dupGroups.map((g, i) => `
        <div class="dup-group">
          <div class="muted">${g.type === "name" ? "Mesmo nome (grafia diferente)" : "Mesmo telefone, nome diferente"}</div>
          <div>${g.rawVariants.join(" / ")}</div>
          <label>
            <input type="checkbox" id="dupgroup_${i}" ${g.type === "name" ? "checked" : ""}>
            <span>É a mesma pessoa</span>
          </label>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="section">
      <h2>Linhas prontas (${okRows.length})</h2>
      <table class="data-table">
        <tr><th>Cliente</th><th>Data</th><th>Valor</th></tr>
        ${okRows.map(r => `<tr><td>${r.clientRaw}</td><td>${r.date}</td><td>${r.amount}</td></tr>`).join("")}
      </table>
    </div>

    ${reviewRows.length > 0 ? `
    <div class="section">
      <h2>Assinaladas — não importadas (${reviewRows.length})</h2>
      <table class="data-table">
        <tr><th>Cliente</th><th>Motivo</th></tr>
        ${reviewRows.map(r => `<tr><td>${r.clientRaw}</td><td>${r.issues.join("; ")}</td></tr>`).join("")}
      </table>
    </div>` : ""}

    <div class="section">
      <button class="btn" id="confirmImportBtn">Importar ${okRows.length} linhas</button>
      <div id="status" class="status"></div>
    </div>
  `;

  document.getElementById("backBtn").onclick = () => renderDashboard(business);

  document.getElementById("confirmImportBtn").onclick = async () => {
    const status = document.getElementById("status");
    setStatus(status, "A importar...");
    try {
      const nameToCanonical = {};
      dupGroups.forEach((g, i) => {
        const merge = document.getElementById(`dupgroup_${i}`).checked;
        if (merge) {
          const canonical = cleanName(g.rawVariants.sort((a, b) => cleanName(b).length - cleanName(a).length)[0]);
          g.rows.forEach(r => { nameToCanonical[r.clientNormalized] = canonical; });
        }
      });

      const finalClientNames = new Set();
      okRows.forEach(r => {
        const canonical = nameToCanonical[r.clientNormalized] || cleanName(r.clientRaw);
        finalClientNames.add(canonical);
      });

      const nameToId = {};
      for (const name of finalClientNames) {
        const created = await api("/rest/v1/clients", {
          method: "POST",
          headers: { "Prefer": "return=representation" },
          body: JSON.stringify({ business_id: business.id, name })
        });
        nameToId[name] = created[0].id;
      }

      let salesCount = 0;
      for (const r of okRows) {
        const canonical = nameToCanonical[r.clientNormalized] || cleanName(r.clientRaw);
        await api("/rest/v1/sales", {
          method: "POST",
          body: JSON.stringify({
            business_id: business.id,
            client_id: nameToId[canonical],
            amount: r.amount,
            sale_date: r.date
          })
        });
        salesCount++;
      }

      setStatus(status, `Importado: ${finalClientNames.size} clientes, ${salesCount} vendas.`, "ok");
      setTimeout(() => renderDashboard(business), 2000);
    } catch (e) {
      setStatus(status, e.message, "err");
    }
  };
}

// ============ Init ============
captureTokenFromHash();
if (getSession()) {
  renderApp();
} else {
  renderLogin();
}
</script>
